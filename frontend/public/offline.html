<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #0f172a;
            color: #fff
        }

        .card {
            max-width: 520px;
            padding: 28px;
            text-align: center
        }

        .logo {
            width: 96px;
            height: 96px;
            margin: 0 auto 12px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">BBIT</div>
        <h1>You're offline</h1>
        <p>The app can still open cached pages. Connect to the internet to sync latest data.</p>
    </div>
</body>

</html>

version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: bbit
      POSTGRES_PASSWORD: bbitpass
      POSTGRES_DB: bbitdb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://bbit:bbitpass@db:5432/bbitdb
      PORT: 4000
      JWT_SECRET: bbit-secret-key-2025
      # Email SMTP Configuration - UPDATE THESE VALUES
      EMAIL_SERVICE: gmail
      EMAIL_USER: your-email@gmail.com
      EMAIL_PASSWORD: your-app-password-here
      FRONTEND_URL: http://localhost:3005
      # Contact form emails will be sent to this address
      CONTACT_EMAIL: rnd@bbit.edu.in
    ports:
      - "4005:4000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4005
    ports:
      - "3005:3000"
    depends_on:
      - backend

volumes:
  db_data:
